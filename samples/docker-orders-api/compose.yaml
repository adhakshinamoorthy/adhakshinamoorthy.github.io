services:
  orders-api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "dotnet", "DockerOrdersApi.dll", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
