name: verified-release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore CicdReleasePipeline.slnx --locked-mode
      - run: dotnet build CicdReleasePipeline.slnx -c Release --no-restore
      - run: dotnet test CicdReleasePipeline.slnx -c Release --no-build --logger trx --collect "XPlat Code Coverage"
      - run: dotnet list CicdReleasePipeline.slnx package --vulnerable --include-transitive
      - name: Publish immutable artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/ReleaseManifest -c Release --no-build -o artifacts/release
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: artifacts/release
      - name: Verify and deploy promoted artifact
        run: |
          test -f artifacts/release/ReleaseManifest.dll
          echo "Replace this line with a provider-specific deployment using OIDC."
