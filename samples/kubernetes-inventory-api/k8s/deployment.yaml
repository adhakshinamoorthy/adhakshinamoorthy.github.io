apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  labels: { app.kubernetes.io/name: inventory-api }
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app.kubernetes.io/name: inventory-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: inventory-api }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/adhakshinamoorthy/kubernetes-inventory-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
          startupProbe:
            httpGet: { path: /livez, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
spec:
  selector: { app.kubernetes.io/name: inventory-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: inventory-api }
