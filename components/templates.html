<template id="technology-card-template">
  <article class="technology-card card reveal">
    <div class="technology-card-icon" aria-hidden="true"></div>
    <div class="card-kicker"></div>
    <h3></h3>
    <p></p>
    <a class="card-link">Explore guide <span aria-hidden="true">→</span></a>
  </article>
</template>

<template id="github-card-template">
  <article class="github-card card reveal">
    <div class="github-card-head">
      <span class="repo-icon" aria-hidden="true"></span>
      <span class="repo-visibility">Public</span>
    </div>
    <h3></h3>
    <p class="repo-description"></p>
    <div class="tech-pills" aria-label="Technologies"></div>
    <div class="tag-list" aria-label="Tags"></div>
    <div class="repo-actions">
      <a class="button button-small button-primary github-link" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      <a class="button button-small button-secondary demo-link" target="_blank" rel="noreferrer">Live demo <span aria-hidden="true">↗</span></a>
    </div>
  </article>
</template>

<template id="callout-template">
  <aside class="callout">
    <div class="callout-icon" aria-hidden="true"></div>
    <div><strong class="callout-label"></strong><p></p></div>
  </aside>
</template>

<template id="faq-template">
  <details class="faq-item">
    <summary><span class="faq-question"></span><span class="faq-chevron" aria-hidden="true">+</span></summary>
    <div class="faq-answer"></div>
  </details>
</template>

<template id="code-block-template">
  <div class="code-block">
    <div class="code-toolbar">
      <span class="code-language"></span>
      <button class="copy-button" type="button"><span aria-hidden="true">▣</span> Copy</button>
    </div>
    <pre><code></code></pre>
  </div>
</template>
