name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site (pages, preview images, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails if pages or preview images are stale, or verify.mjs finds a problem.
      - run: npm run check

  samples:
    name: Samples (build, test, format)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # Samples pin 10.0.1xx or 10.0.3xx in global.json.
          dotnet-version: |
            10.0.1xx
            10.0.3xx
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('samples/**/*.csproj', 'samples/**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Check C# formatting
        run: dotnet format whitespace --folder samples --verify-no-changes
      - name: Build and test every sample
        run: ./scripts/test-samples.sh
